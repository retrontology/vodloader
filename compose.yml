# NVIDIA GPU: requires nvidia-container-toolkit on the host (see README).

services:
  vodloader:
    container_name: vodloader
    build: ./app
    env_file: .env
    restart: unless-stopped
    # Non-Swarm Docker Compose GPU request.
    gpus: all
    # Compatibility hint for hosts using NVIDIA container runtime.
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./database:/opt/vodloader/database
      - /mnt/media/Capture/vodloader:/opt/vodloader/videos
    ipc: host
    init: true
  nginx:
    container_name: vodloader-nginx
    build: ./nginx
    restart: unless-stopped
    ports:
      - 8000:80
